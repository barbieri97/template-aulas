<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Imagem de exemplo — quadrada">
  <defs>
    <linearGradient id="qfundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fd8"/>
      <stop offset="1" stop-color="#16274a"/>
    </linearGradient>
    <clipPath id="qcorte"><rect width="800" height="800"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#qfundo)"/>

  <g clip-path="url(#qcorte)">
    <!-- Arcos concêntricos saindo do canto: composição abstrata, sem virar figura de coisa
         nenhuma — é placeholder, não ilustração. -->
    <g fill="none" stroke="#fbfbf7" stroke-width="6" opacity=".55">
      <circle cx="120" cy="680" r="180"/>
      <circle cx="120" cy="680" r="300"/>
      <circle cx="120" cy="680" r="420"/>
      <circle cx="120" cy="680" r="540"/>
    </g>
    <circle cx="560" cy="240" r="120" fill="#fbfbf7" opacity=".92"/>
    <circle cx="560" cy="240" r="180" fill="none" stroke="#fbfbf7" stroke-width="6" opacity=".5"/>
  </g>

  <text x="400" y="740" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="30" font-weight="700" fill="#fbfbf7" opacity=".75">800 × 800</text>
</svg>
