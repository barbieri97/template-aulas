<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Textura de exemplo para fundo de slide">
  <defs>
    <pattern id="pontos" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="3" fill="#16274a" opacity=".28"/>
    </pattern>
    <linearGradient id="veu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf9"/>
      <stop offset="1" stop-color="#fbfbf7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#veu)"/>
  <rect width="1600" height="900" fill="url(#pontos)"/>
  <g fill="none" stroke="#1f4fd8" stroke-width="2" opacity=".18">
    <circle cx="1320" cy="180" r="240"/>
    <circle cx="240" cy="760" r="320"/>
  </g>
</svg>
