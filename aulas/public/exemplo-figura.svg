<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Figura de exemplo — gráfico de duas séries ao longo do tempo">
  <rect width="960" height="620" fill="#f8f7f4"/>

  <!-- Grade -->
  <g stroke="#e2e0da" stroke-width="1">
    <path d="M120 500 H900"/><path d="M120 420 H900"/><path d="M120 340 H900"/>
    <path d="M120 260 H900"/><path d="M120 180 H900"/><path d="M120 100 H900"/>
  </g>

  <!-- Eixos -->
  <g stroke="#17202a" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M120 80 V520"/>
    <path d="M120 520 H900"/>
  </g>

  <!-- Série A: cresce e satura -->
  <polyline fill="none" stroke="#0d7d7a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
    points="130,505 200,470 265,412 330,340 395,268 462,208 528,168 596,146 662,134 730,126 800,122 870,118"/>

  <!-- Série B: cresce devagar e constante -->
  <polyline fill="none" stroke="#5c6b74" stroke-width="4" stroke-dasharray="10 9" stroke-linejoin="round" stroke-linecap="round"
    points="130,508 200,496 265,482 330,466 395,450 462,432 528,414 596,394 662,374 730,352 800,330 870,306"/>

  <!-- Pontos medidos na série A -->
  <g fill="#0d7d7a">
    <circle cx="265" cy="412" r="7"/><circle cx="462" cy="208" r="7"/>
    <circle cx="662" cy="134" r="7"/><circle cx="870" cy="118" r="7"/>
  </g>

  <!-- Rótulos -->
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#17202a">
    <text x="120" y="52" font-size="26" font-weight="700">Figura de exemplo</text>
    <text x="120" y="576" font-size="20" fill="#5c6b74">tempo →</text>
    <text x="-330" y="34" font-size="20" fill="#5c6b74" transform="rotate(-90)">medida →</text>
  </g>

  <!-- Legenda -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#5c6b74">
    <path d="M636 44 H676" stroke="#0d7d7a" stroke-width="5" stroke-linecap="round"/>
    <text x="688" y="50">série A</text>
    <path d="M776 44 H816" stroke="#5c6b74" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round"/>
    <text x="828" y="50">série B</text>
  </g>
</svg>
